services:
  backend:
    build:
      context: ./autocard/backend
      dockerfile: Dockerfile
    container_name: autocard-backend
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
    depends_on:
      - redis
    restart: always

  redis:
    image: redis:alpine
    container_name: autocard-redis
    ports:
      - "6379:6379"
    restart: always

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: autocard-tunnel
    restart: always
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
