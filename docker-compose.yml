version: '3.8'

services:
  backend:
    build:
      context: ./autocard/backend
      dockerfile: Dockerfile
    container_name: autocard-backend
    ports:
      - "8080:8080"
    env_file:
      - ./autocard/backend/.env
    restart: always

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: autocard-tunnel
    restart: always
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
