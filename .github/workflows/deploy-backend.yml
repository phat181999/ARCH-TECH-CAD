name: CI/CD Backend to Render

on:
  push:
    branches:
      - master
    paths:
      - "autocard/backend/**"
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: autocard/backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: autocard/backend/go.sum

      - name: Install dependencies
        run: go mod download

      - name: Run Tests
        run: go test -v ./...

      - name: Build binary
        run: go build -v -o autocard-server ./...

  deploy:
    needs: test-and-build
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy Hook
        if: github.ref == 'refs/heads/master'
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "Warning: RENDER_DEPLOY_HOOK_URL secret is not set in GitHub Secrets. Skipping automatic deployment trigger."
            echo "To enable auto-deploy, add your Render Deploy Hook URL as RENDER_DEPLOY_HOOK_URL in Repository Settings -> Secrets and Variables -> Actions."
          else
            curl -f -X POST "$DEPLOY_HOOK"
          fi
